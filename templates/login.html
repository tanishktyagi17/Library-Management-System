<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System | Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#0f172a,#1e3a8a,#2563eb,#06b6d4);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    filter:blur(5px);
    animation:float 10s infinite ease-in-out alternate;
}

.circle:nth-child(1){
    width:260px;
    height:260px;
    left:-60px;
    top:-50px;
}

.circle:nth-child(2){
    width:180px;
    height:180px;
    right:70px;
    bottom:60px;
}

.circle:nth-child(3){
    width:120px;
    height:120px;
    left:70%;
    top:15%;
}

@keyframes float{
    from{transform:translateY(0);}
    to{transform:translateY(35px);}
}

.login-box{

    width:390px;
    padding:40px;
    border-radius:22px;

    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.2);

    box-shadow:0 25px 50px rgba(0,0,0,.35);

    color:white;

}

.logo{

    width:75px;
    height:75px;

    margin:auto;
    margin-bottom:18px;

    border-radius:50%;

    background:linear-gradient(135deg,#38bdf8,#2563eb);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:28px;
}

h1{

    text-align:center;
    font-size:27px;
    font-weight:600;
}

.subtitle{

    text-align:center;
    opacity:.8;
    margin-top:8px;
    margin-bottom:30px;
    font-size:14px;
}

.input-box{

    position:relative;
    margin-bottom:18px;
}

.input-box i:first-child{

    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#d1d5db;
}

.input-box input{

    width:100%;
    padding:14px 45px;
    border-radius:10px;
    border:none;
    outline:none;

    background:rgba(255,255,255,.08);
    color:white;
    font-size:15px;
    transition:.3s;
}

.input-box input::placeholder{
    color:#cbd5e1;
}

.input-box input:focus{

    background:rgba(255,255,255,.15);
    box-shadow:0 0 15px rgba(56,189,248,.4);
}

.toggle{

    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#d1d5db;
}

.error{

    background:#dc262620;
    border:1px solid #ef4444;
    color:#fecaca;

    padding:12px;
    border-radius:8px;
    margin-bottom:18px;
    font-size:14px;
}

button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;

    background:linear-gradient(135deg,#06b6d4,#2563eb);

    color:white;
    font-size:16px;
    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

button:hover{

    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(37,99,235,.4);
}

.footer{

    text-align:center;
    margin-top:22px;
    font-size:13px;
    opacity:.75;
}

.spinner{

    display:none;
    margin-left:8px;
}

@media(max-width:450px){

.login-box{

width:92%;
padding:30px 25px;

}

}

    </style>

</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="login-box">

    <div class="logo">
        <i class="fas fa-book"></i>
    </div>

    <h1>Library Management</h1>

    <div class="subtitle">
        Administrator Login
    </div>

    {% if error %}
    <div class="error">
        <i class="fas fa-circle-exclamation"></i>
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" id="loginForm">

        <div class="input-box">

            <i class="fas fa-user"></i>

            <input
                type="text"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required>

        </div>

        <div class="input-box">

            <i class="fas fa-lock"></i>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required>

            <i class="fas fa-eye toggle" id="togglePassword"></i>

        </div>

        <button type="submit" id="loginBtn">

            Login

            <i class="fas fa-spinner fa-spin spinner" id="spinner"></i>

        </button>

    </form>

    <div class="footer">

        © 2026 Library Management System

    </div>

</div>

<script>

const toggle=document.getElementById("togglePassword");
const password=document.getElementById("password");

toggle.onclick=function(){

if(password.type==="password"){

password.type="text";
toggle.classList.replace("fa-eye","fa-eye-slash");

}else{

password.type="password";
toggle.classList.replace("fa-eye-slash","fa-eye");

}

};

document.getElementById("loginForm").addEventListener("submit",function(){

document.getElementById("spinner").style.display="inline-block";
document.getElementById("loginBtn").disabled=true;

});

</script>

</body>
</html>
