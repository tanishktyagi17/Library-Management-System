<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='homestyle.css') }}">
</head>
<body>

<div class="container">
    <h1>👨‍🎓 Student List</h1>

    <!-- Buttons -->
    <a class="btn" href="/add_student">➕ Add Student</a>
    <a class="btn" href="/">🏠 Home</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Student ID</th>
            <th>Course</th>
            <th>Phone</th>
        </tr>

        {% for s in students %}
        <tr>
            <td>{{ s[0] }}</td>
            <td>{{ s[1] }}</td>
            <td>{{ s[2] }}</td>
            <td>{{ s[3] }}</td>
            <td>{{ s[4] }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
